name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install backend wheel only
        shell: bash
        run: python -m pip install dist/*.whl
      - run: python -m pip check
      - name: Verify installed backend distribution and resources
        working-directory: ${{ runner.temp }}
        run: python -I -c "import sys; from pathlib import Path; import iadpython as r; from importlib.resources import files; from importlib.metadata import version, packages_distributions; assert Path(r.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); assert version('radphen-iadpython') == '0.7.0'; assert 'iadpython' not in [d.lower().replace('_', '-') for d in packages_distributions().get('iadpython', [])]; assert files('iadpython').joinpath('data/M38597.csv').is_file(); assert len(r.subject_average_reflectance(1)[0]) > 0"
      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -m pytest '${{ github.workspace }}/tests'
          --ignore='${{ github.workspace }}/tests/test_all_notebooks.py'
          --import-mode=importlib -vv --durations=25
          --junitxml='${{ runner.temp }}/backend-results.xml'
      - name: Preserve test results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/backend-results.xml
      - run: iadp --version

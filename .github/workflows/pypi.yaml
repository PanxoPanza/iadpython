name: Publish radphen-iadpython
on:
  workflow_dispatch:
    inputs:
      confirm-version:
        description: Type 0.7.0 when dispatching the validated release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  dispatch-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Require release-tag workflow
        run: |
          echo 'Dispatch pypi.yaml with --ref v0.7.0 and confirm-version=0.7.0 after backend CI passes.'
          exit 1
